[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eii-cloud"
version = "0.1.0"
description = "Early Instability Indicator Cloud: context-aware, explainable instability detection, evidence fusion and scientific visualization for predictive maintenance."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Bidollahkhani" }]
keywords = ["anomaly detection", "predictive maintenance", "observability", "validity envelope", "evidence fusion", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
tiff = ["pillow>=9.0"]
dev = ["pytest>=7", "pytest-cov", "scikit-learn>=1.3", "pillow>=9.0", "mypy", "ruff", "build", "twine"]
all = ["scikit-learn>=1.3", "pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/michaelkhany/EII_Cloud-Package"
Repository = "https://github.com/michaelkhany/EII_Cloud-Package"
Documentation = "https://github.com/michaelkhany/EII_Cloud-Package#readme"
Issues = "https://github.com/michaelkhany/EII_Cloud-Package/issues"

[project.scripts]
eii-cloud = "eii_cloud.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eii_cloud"]

[tool.hatch.build.targets.sdist]
include = ["src/eii_cloud", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:eii_cloud.*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
packages = ["eii_cloud"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "E501", "B905"]
